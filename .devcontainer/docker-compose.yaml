services:
  workspace:
    image: "mcr.microsoft.com/devcontainers/javascript-node:20"
    volumes:
      - ..:/workspace
    command: sleep infinity
    env_file:
      - ../.env

  db:
    image: "postgres:17"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - ../.env
    ports:
      - "5432:5432"

volumes:
  postgres-data:
